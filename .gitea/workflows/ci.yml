name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs for the same ref when a new push/PR event arrives.
# Saves CI cycles on rapid re-pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `preset` selects the configuration from CMakePresets.json; the
        # `cc`/`cxx` env vars are read by CMake's compiler detection. The
        # presets are compiler-agnostic, so the same `release`/`debug`
        # preset is used by both gcc and clang matrix entries.
        preset: [release, debug]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Configure
        run: cmake --preset=${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset=${{ matrix.preset }}

      - name: Test
        run: ctest --preset=${{ matrix.preset }}

  continuous:
    # The KSG/continuous estimators live behind MRMR_HAS_CONTINUOUS, so the
    # build-and-test matrix above never compiles a line of them — the option
    # defaults to OFF. This job turns it on and runs the same ctest suite,
    # which then also picks up the MRMR_CONTINUOUS-gated CLI tests in
    # test/CMakeLists.txt and the KSG unit tests in test_mrmr.cpp.
    #
    # Both compilers, because the warning set that -Werror promotes differs
    # between them and this code path has never been through either.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Configure (fetches the pinned kdtree release)
        run: cmake --preset=continuous

      - name: Build
        run: cmake --build --preset=continuous

      - name: Test
        run: ctest --preset=continuous

  install:
    # Every other job consumes the headers through the library's
    # BUILD_INTERFACE, i.e. straight out of include/, so none of them can
    # observe an installation that is missing headers. This job installs to
    # a staging prefix and then only ever looks at that prefix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        # Tests off: this job validates the installed artifact, and skipping
        # them avoids fetching Catch2 for a build whose binaries go unused.
        run: |
          cmake --preset=release -DMRMR_BUILD_TESTS=OFF
          cmake --build --preset=release

      - name: Install to a staging prefix
        run: cmake --install build/release --prefix "$PWD/stage"

      - name: Assert every public header was installed
        # Catches a header added to include/ but not to MRMR_PUBLIC_HEADERS.
        # The compile step below only catches the ones reachable by include.
        run: |
          (cd include && find . -name '*.hpp' | sort) > "$RUNNER_TEMP/headers-source"
          (cd stage/include && find . -name '*.hpp' | sort) > "$RUNNER_TEMP/headers-installed"
          if ! diff -u "$RUNNER_TEMP/headers-source" "$RUNNER_TEMP/headers-installed"; then
            echo "::error::installed header set differs from include/; update MRMR_PUBLIC_HEADERS in CMakeLists.txt"
            exit 1
          fi

      - name: Compile a consumer against the installed tree only
        # Resolves mrmr via find_package() against the staging prefix, with
        # no path into the source tree, so a header that is declared but not
        # installed fails here rather than in a downstream project.
        run: |
          cmake -S test/install-test -B build/install-test \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build/install-test
          ./build/install-test/mrmr_install_consumer

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + pre-commit
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: uvx --with pre-commit==4.5.1 pre-commit run --all-files --hook-stage pre-commit
        env:
          SKIP: no-commit-to-branch
      - run: uvx --with pre-commit==4.5.1 pre-commit run --all-files --hook-stage pre-push
        env:
          SKIP: no-commit-to-branch

  lint:
    runs-on: ubuntu-latest
    # CC/CXX pinned to clang so the generated compile_commands.json does
    # not include GCC-only flags (-Wlogical-op, -Wduplicated-cond) that
    # clang-tidy cannot parse — the GCC-gated genexes in
    # MRMR_WARNING_FLAGS evaluate to empty when CXX is clang++.
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          pip install clang-tidy==20.1.0

      - name: Configure (for compile_commands.json)
        run: cmake --preset=release

      - name: Run clang-tidy
        # Lint source files only; HeaderFilterRegex in .clang-tidy
        # propagates diagnostics back to public headers when those
        # headers are transitively included by a source TU. Passing
        # headers directly causes clang-tidy to fall back to "running
        # without flags" (no compile_commands entry exists for headers
        # alone), which breaks parsing for any C++20 syntax (requires,
        # <=>, etc.) that wasn't tokenizable under clang-tidy's default
        # C++17 fallback.
        run: clang-tidy -p build/release tools/*.cpp test/*.cpp

  sanitize:
    # Debug build with AddressSanitizer + UndefinedBehaviorSanitizer.
    # Runs the full test suite so any UB or memory bug instantiated in
    # test code fails the PR. Halt-on-error is enforced at compile time
    # via -fno-sanitize-recover=all; the env vars are belt-and-braces in
    # case the flag is ever changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Debug + sanitizers)
        run: cmake --preset=sanitize

      - name: Build
        run: cmake --build --preset=sanitize

      - name: Test under sanitizers
        # ASAN_OPTIONS / UBSAN_OPTIONS are set on the sanitize test preset
        # itself; listing them here would just duplicate the preset.
        run: ctest --preset=sanitize

  # ==========================================================================
  # Secret scan (tree). The commit-stage gitleaks hook runs
  # `gitleaks git --staged`, and nothing is staged on a clean CI checkout --
  # it scans zero bytes and exits 0, so it is NOT a backstop for a commit made
  # with hooks bypassed. This scans the working tree instead. Run from the
  # repository root: in `dir` mode gitleaks reports File exactly as given, so
  # `dir .` keeps paths repo-relative and a `paths` allowlist anchored `^...`
  # keeps matching. Version tracks .pre-commit-config.yaml's gitleaks rev.
  # ==========================================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the tree for secrets
        run: gitleaks dir . --redact --no-banner
