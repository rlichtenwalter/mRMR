# Default stage for every hook in this config. Individual hooks can opt
# into a different stage (e.g. linters/tests at pre-push) by setting
# their own `stages:`. Making this explicit avoids pre-commit's fallback
# behavior of running hooks at every stage.
default_stages: [pre-commit]

default_install_hook_types: [pre-commit, pre-push]

repos:
  # Markdown formatting. Prettier owns line width, list indentation and
  # table alignment; markdownlint keeps the semantic rules (.markdownlint.jsonc
  # inlines markdownlint's own `style/prettier` preset). Scoped with `types:`
  # -- the hook defaults to every text file.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types: [markdown]
        stages: [pre-commit]
  # Secret scanning at the COMMIT stage: by push time a secret is already a
  # commit object, in the reflog and in any backup, so removing it means a
  # history rewrite rather than an amend.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        stages: [pre-push]

  # --- Commit stage: formatting + file hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=1000]
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: mixed-line-ending
        stages: [pre-commit]
        args: [--fix=lf]
      - id: no-commit-to-branch
        stages: [pre-commit]
        args: [--branch, main]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.2
    hooks:
      - id: clang-format
        stages: [pre-commit]
        types_or: [c, c++]
